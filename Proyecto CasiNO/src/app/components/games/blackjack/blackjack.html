<div class="casino-glass rounded-4 p-3 p-lg-4">
  <div class="row g-3 mb-3 align-items-end">
    <div class="col-12 col-md-4">
      <label class="form-label">Apuesta</label>
      <input class="form-control" type="number" [(ngModel)]="betAmount" min="10" step="10" [disabled]="roundActive" />
    </div>
    <div class="col-12 col-md-8 d-flex flex-wrap gap-2">
      <button class="btn btn-casino" (click)="deal()" [disabled]="roundActive">Repartir</button>
      <button class="btn btn-outline-light" (click)="hit()" [disabled]="!roundActive">Pedir carta</button>
      <button class="btn btn-neon" (click)="stand()" [disabled]="!roundActive">Plantarse</button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6">
      <h3 class="h6 text-secondary">Jugador ({{ playerScore }})</h3>
      <div class="d-flex gap-2 flex-wrap">
        @for (card of playerCards; track $index) {
          <div class="card-face">{{ card.rank }}{{ card.suit }}</div>
        }
      </div>
    </div>
    <div class="col-12 col-md-6">
      <h3 class="h6 text-secondary">Banca ({{ dealerScore }})</h3>
      <div class="d-flex gap-2 flex-wrap">
        @for (card of dealerCards; track $index) {
          <div class="card-face">{{ card.rank }}{{ card.suit }}</div>
        }
      </div>
    </div>
  </div>

  <div class="alert casino-alert py-2 mt-3 mb-0">{{ statusMessage }}</div>
</div>
