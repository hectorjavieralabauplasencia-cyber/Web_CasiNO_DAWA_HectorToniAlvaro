<div class="casino-glass rounded-4 p-3 p-lg-4">
  <div class="api-panel d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
    <div>
      <small class="text-secondary d-block">API Pokerist</small>
      <strong>Pokerist Texas Hold'em</strong>
      <p class="mb-0 text-secondary">Accede al poker oficial del ecosistema Pokerist.</p>
    </div>
    <a class="btn btn-neon" [href]="pokeristApiUrl" target="_blank" rel="noopener noreferrer">
      Abrir API
    </a>
  </div>

  <div class="row g-3 align-items-end mb-3">
    <div class="col-12 col-md-4">
      <label class="form-label">Apuesta</label>
      <input class="form-control" type="number" [(ngModel)]="betAmount" min="10" step="10" />
    </div>
    <div class="col-12 col-md-4 d-grid">
      <button class="btn btn-casino" (click)="dealHand()">Repartir mano</button>
    </div>
    <div class="col-12 col-md-4">
      <div class="stat-mini text-center">
        <small class="text-secondary d-block">Evaluacion</small>
        <strong class="text-warning">{{ handLabel }}</strong>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 flex-wrap mb-3">
    @for (card of hand; track $index) {
      <div class="card-face">{{ card.rank }}{{ card.suit }}</div>
    }
  </div>

  <div class="alert casino-alert py-2 mb-0">{{ statusMessage }}</div>
</div>
